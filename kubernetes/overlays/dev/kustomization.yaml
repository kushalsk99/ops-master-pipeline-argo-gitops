apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web-service-dev

bases:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: dev

patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: web-service

configMapGenerator:
  - name: web-service-config
    behavior: merge
    literals:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - CACHE_TTL_SECONDS=60
