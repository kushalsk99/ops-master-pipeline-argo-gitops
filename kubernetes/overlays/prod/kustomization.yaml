apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web-service-prod

bases:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: prod

patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: web-service

configMapGenerator:
  - name: web-service-config
    behavior: merge
    literals:
      - APP_ENV=production
      - LOG_LEVEL=warn
      - CACHE_TTL_SECONDS=600
